<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikita &amp; Connor</title>
    <link rel="icon" href="images/ring_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===================== Navigation ===================== -->
    <nav class="site-nav" id="site-nav">
        <div class="nav-inner">
            <a href="#top" class="nav-brand monogram" id="nav-brand">N <span class="amp">&amp;</span> C</a>
            <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Save the Date</a></li>
                <li><a href="#new-delhi">New Delhi</a></li>
                <li><a href="#new-hampshire">New Hampshire</a></li>
                <li><a href="#faq">FAQ</a></li>
                <li><a href="#photos">Photos</a></li>
            </ul>
        </div>
    </nav>

    <!-- ===================== Full-bleed hero ===================== -->
    <header class="hero" id="top">
        <div class="hero-bg" id="hero-bg"></div>
        <h1 id="hero-names">Nikita <span class="amp">&amp;</span> Connor</h1>
        <span class="eyebrow hero-eyebrow">We're getting married!</span>
    </header>

    <!-- ===================== Intro ===================== -->
    <section class="intro-band" id="intro">
        <div class="mono-divider"><span class="monogram">N <span class="amp">&amp;</span> C</span></div>
        <p id="hero-intro"></p>
    </section>

    <!-- ===================== New Delhi ===================== -->
    <section id="new-delhi">
        <div class="spread" id="spread-new-delhi"></div>
    </section>

    <!-- ===================== New Hampshire ===================== -->
    <section id="new-hampshire" class="band-sand">
        <div class="spread reverse" id="spread-new-hampshire"></div>
    </section>

    <!-- ===================== FAQ ===================== -->
    <section class="faq-section" id="faq">
        <div class="section-head">
            <h2>FAQs</h2>
        </div>
        <div class="faq-groups">
            <details class="faq-group" open>
                <summary><h3>New Delhi</h3></summary>
                <div id="faq-new-delhi"></div>
            </details>
            <details class="faq-group" open>
                <summary><h3>New Hampshire</h3></summary>
                <div id="faq-new-hampshire"></div>
            </details>
        </div>
    </section>

    <!-- ===================== Photos ===================== -->
    <section class="gallery-section" id="photos">
        <div class="section-head">
            <span class="eyebrow">Us</span>
            <h2>Engagement Photos</h2>
        </div>
        <div class="gallery" id="gallery"></div>
    </section>

    <!-- ===================== Footer ===================== -->
    <footer>
        <div class="monogram">N <span class="amp">&amp;</span> C</div>
        <p><a href="mailto:connor.nikita.2022@gmail.com">connor.nikita.2022@gmail.com</a></p>
    </footer>

    <!-- ===================== Lightbox overlay ===================== -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="lightbox-btn lightbox-close" id="lb-close" aria-label="Close">&times;</button>
        <button class="lightbox-btn lightbox-prev"  id="lb-prev"  aria-label="Previous photo">&lsaquo;</button>
        <img id="lb-img" src="" alt="">
        <button class="lightbox-btn lightbox-next"  id="lb-next"  aria-label="Next photo">&rsaquo;</button>
    </div>

    <!-- Content lives in content.js (edit that file to update the site) -->
    <script src="content.js"></script>
    <script>
        /* -----------------------------------------------------------------
         *  Render the page from the data in content.js.
         *  (Editing content.js is all that's needed to change the site.)
         * ----------------------------------------------------------------- */

        function esc(str) {
            return String(str == null ? "" : str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // Escape text, then turn Markdown-style [label](url) into a link.
        // Lets content.js embed links inside any answer, e.g.
        //   "...listed rentals ([download PDF](images/rentals.pdf))"
        function richText(str) {
            return esc(str).replace(
                /\[([^\]]+)\]\(([^)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>'
            );
        }

        // Turn "Nikita & Connor" into an italic-gold ampersand for headings.
        function fancyNames(names) {
            return esc(names).replace(/&amp;/g, '<span class="amp">&amp;</span>');
        }

        // ---- Names, hero image, intro -------------------------------------
        if (WEDDING.coupleNames) {
            document.getElementById("hero-names").innerHTML = fancyNames(WEDDING.coupleNames);
            document.title = WEDDING.coupleNames;
        }
        if (WEDDING.heroImage) {
            document.getElementById("hero-bg").style.backgroundImage =
                "url('" + WEDDING.heroImage + "')";
        }
        document.getElementById("hero-intro").innerHTML = esc(WEDDING.intro);

        // ---- Editorial spreads --------------------------------------------
        function renderSpread(el, ev) {
            if (!el || !ev) return;

            var meta = "";
            var rows = [];
            if (ev.date)     rows.push({ k: "When",  v: ev.date });
            if (ev.location) rows.push({ k: "Where", v: ev.location });
            if (ev.venue) {
                // Link the venue to its map when a mapUrl is provided.
                var venueVal = ev.mapUrl
                    ? '<a class="map-link" href="' + esc(ev.mapUrl) +
                      '" target="_blank" rel="noopener">' + esc(ev.venue) +
                      ' <span class="map-pin" aria-hidden="true">&#9906;</span></a>'
                    : esc(ev.venue);
                rows.push({ k: "Venue", v: venueVal, raw: true });
            }
            if (ev.details && ev.details.length) {
                ev.details.forEach(function (d) { rows.push({ k: d.label, v: d.value }); });
            }
            if (rows.length) {
                meta = '<ul class="spread-meta">' + rows.map(function (r) {
                    var val = r.raw ? r.v : esc(r.v);
                    return '<li><span class="k">' + esc(r.k) + '</span>' +
                           '<span class="v">' + val + '</span></li>';
                }).join("") + '</ul>';
            }

            var photo = ev.image
                ? '<div class="spread-photo"><img src="' + esc(ev.image) +
                  '" alt="' + esc(ev.title) + '" loading="lazy"></div>'
                : '';

            el.innerHTML =
                photo +
                '<div class="spread-body">' +
                    '<span class="eyebrow">The Celebration</span>' +
                    '<h2>' + esc(ev.title) + '</h2>' +
                    meta +
                    '<p class="spread-desc">' + esc(ev.description) + '</p>' +
                '</div>';
        }
        renderSpread(document.getElementById("spread-new-delhi"), WEDDING.newDelhi);
        renderSpread(document.getElementById("spread-new-hampshire"), WEDDING.newHampshire);

        // ---- FAQ ----------------------------------------------------------
        function renderFaqs(el, faqs) {
            if (!el) return;
            el.innerHTML = (faqs || []).map(function (f) {
                return '<details class="faq-item">' +
                       '<summary>' + esc(f.q) + '</summary>' +
                       '<div class="faq-answer">' + renderAnswer(f.a) + '</div>' +
                       '</details>';
            }).join("");
        }
        // An answer can be a plain string, or an object with an optional
        // lead-in { text: "..." } and/or a list of { bullets: ["...", "..."] }.
        function renderAnswer(a) {
            if (typeof a === "string") return richText(a);
            var html = "";
            if (a && a.text) html += '<p>' + richText(a.text) + '</p>';
            if (a && a.bullets && a.bullets.length) {
                html += '<ul>' + a.bullets.map(function (b) {
                    return '<li>' + richText(b) + '</li>';
                }).join("") + '</ul>';
            }
            return html;
        }
        renderFaqs(document.getElementById("faq-new-delhi"), FAQS_NEW_DELHI);
        renderFaqs(document.getElementById("faq-new-hampshire"), FAQS_NEW_HAMPSHIRE);

        // ---- Gallery ------------------------------------------------------
        var galleryEl = document.getElementById("gallery");
        galleryEl.innerHTML = (GALLERY || []).map(function (p, i) {
            return '<button class="gallery-item" data-index="' + i + '" aria-label="View photo: ' + esc(p.alt) + '">' +
                   '<img src="' + esc(p.src) + '" alt="' + esc(p.alt) + '" loading="lazy">' +
                   '</button>';
        }).join("");

        // ---- Lightbox -----------------------------------------------------
        var lb      = document.getElementById("lightbox");
        var lbImg   = document.getElementById("lb-img");
        var current = 0;

        function openLightbox(i) {
            current = (i + GALLERY.length) % GALLERY.length;
            lbImg.src = GALLERY[current].src;
            lbImg.alt = GALLERY[current].alt;
            lb.classList.add("open");
            lb.setAttribute("aria-hidden", "false");
        }
        function closeLightbox() {
            lb.classList.remove("open");
            lb.setAttribute("aria-hidden", "true");
        }

        galleryEl.addEventListener("click", function (e) {
            var btn = e.target.closest(".gallery-item");
            if (btn) openLightbox(parseInt(btn.dataset.index, 10));
        });
        document.getElementById("lb-close").addEventListener("click", closeLightbox);
        document.getElementById("lb-prev").addEventListener("click", function () { openLightbox(current - 1); });
        document.getElementById("lb-next").addEventListener("click", function () { openLightbox(current + 1); });
        lb.addEventListener("click", function (e) { if (e.target === lb) closeLightbox(); });
        document.addEventListener("keydown", function (e) {
            if (!lb.classList.contains("open")) return;
            if (e.key === "Escape")     closeLightbox();
            if (e.key === "ArrowLeft")  openLightbox(current - 1);
            if (e.key === "ArrowRight") openLightbox(current + 1);
        });

        // ---- Nav: transparent over hero, solid once scrolled --------------
        var nav = document.getElementById("site-nav");
        function onScroll() {
            if (window.scrollY > window.innerHeight * 0.7) nav.classList.add("scrolled");
            else nav.classList.remove("scrolled");
        }
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();

        // ---- Nav: collapsible menu on mobile ------------------------------
        var navToggle = document.getElementById("nav-toggle");
        var navLinks  = document.getElementById("nav-links");
        function setMenu(open) {
            nav.classList.toggle("menu-open", open);
            navToggle.setAttribute("aria-expanded", open ? "true" : "false");
        }
        navToggle.addEventListener("click", function () {
            setMenu(!nav.classList.contains("menu-open"));
        });
        // Close the menu after tapping a link.
        navLinks.addEventListener("click", function (e) {
            if (e.target.closest("a")) setMenu(false);
        });
    </script>
</body>
</html>
